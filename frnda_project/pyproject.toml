[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "frnda"
version = "0.1.0"
description = "Fuzzy Reverse-Neighborhood Discriminant Analysis (FRNDA/2DFRNDA/RNDA) -- a from-scratch implementation"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
demo = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["frnda"]
